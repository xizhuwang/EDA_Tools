name: Test and deploy EDA Tools
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node tests/prepare-engine.mjs
      - run: npm run test:engine
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: |
          mkdir _site
          cp index.html app.js core.js analysis.js workbench.js style.css responsive.css analysis.css README.md THIRD_PARTY_NOTICES.md LICENSE _site/
          cp -r engine _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
